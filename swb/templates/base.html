<!DOCTYPE html>
<html lang="{{ site.language | default('en-US') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page_title %}{{ page_title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description | default('') }}">
    <meta name="author" content="{{ site.author | default('') }}">
    {% for css in css_files %}
    <link rel="stylesheet" href="{{ site_root }}css/{{ css }}">
    {% endfor %}
</head>
<body>
    <main>
        {{ content }}
    </main>
</body>
</html>
